<svg viewBox="0 0 200 200" width="200" height="200" xmlns="http://www.w3.org/2000/svg">
  <!-- Body -->
  <circle cx="100" cy="110" r="65" fill="#FFB6C1"/>
  
  <!-- Head -->
  <circle cx="100" cy="60" r="45" fill="#FFB6C1"/>
  
  <!-- Ears -->
  <circle cx="65" cy="25" r="18" fill="#FFB6C1"/>
  <circle cx="135" cy="25" r="18" fill="#FFB6C1"/>
  
  <!-- Inner ears -->
  <circle cx="65" cy="25" r="10" fill="#FFE4E1"/>
  <circle cx="135" cy="25" r="10" fill="#FFE4E1"/>
  
  <!-- Eyes -->
  <circle cx="85" cy="50" r="8" fill="#333333"/>
  <circle cx="115" cy="50" r="8" fill="#333333"/>
  
  <!-- Eye shine -->
  <circle cx="87" cy="48" r="3" fill="#ffffff"/>
  <circle cx="117" cy="48" r="3" fill="#ffffff"/>
  
  <!-- Cheeks -->
  <circle cx="55" cy="65" r="12" fill="#FFB6C1" opacity="0.6"/>
  <circle cx="145" cy="65" r="12" fill="#FFB6C1" opacity="0.6"/>
  
  <!-- Mouth -->
  <path d="M 95 75 Q 100 82 105 75" stroke="#FF69B4" stroke-width="2" fill="none" stroke-linecap="round"/>
  
  <!-- Smile line -->
  <path d="M 80 85 Q 100 92 120 85" stroke="#FF69B4" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.5"/>
  
  <!-- Belly highlight -->
  <ellipse cx="100" cy="120" rx="35" ry="40" fill="#ffffff" opacity="0.3"/>
  
  <!-- Feet -->
  <ellipse cx="80" cy="165" rx="15" ry="12" fill="#FFB6C1"/>
  <ellipse cx="120" cy="165" rx="15" ry="12" fill="#FFB6C1"/>
</svg>